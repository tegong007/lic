<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        window.electronAPI.getConfig().then((config) => {
          window.serverAddress = config.serverAddress;
          window.timeOut = config.timeOut;
          window.lang = config.lang;
          window.docCount = config.docCount;
        });
      });
    </script>
  </body>
</html>

<style>
  ::-webkit-scrollbar {
    width: 1.5vw;
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, #03163e 0%, #3662ec 53%);
    border-radius: 50px;
  }
  .notification-custom-class {
    background-image: url('@/assets/image/bg_notify.png');
  }
  .notificationE-custom-class {
    background-image: url('@/assets/image/bg_notify.png');
  }
  .notification-custom-class,
  .notificationE-custom-class {
    bottom: 8vh;
    background-color: #03163ef2;
    background-size: 100% 100%;
    background-repeat: 'no-repeat';
    color: #ffffff;
    .ant-notification-notice-close {
      color: #ffffff !important;
    }
    .ant-notification-notice-icon-error {
      color: #ffffff !important;
    }
    .ant-notification-notice-message {
      color: #ffffff !important;
    }
  }
</style>
